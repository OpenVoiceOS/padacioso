[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "padacioso"
dynamic = ["version"]
description = "dead simple intent parser"
readme = "readme.md"
license = { text = "Apache-2.0" }
authors = [{ name = "jarbasai", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.8"
dependencies = [
    "simplematch",
    "ovos-spec-tools>=1.5.0a1",
    "ovos-utils>=0.3.5,<1.0.0",
]

[project.optional-dependencies]
extras = [
    "ovos-plugin-manager>=0.5.0,<3.0.0",
]
test = [
    # ovos-bus-client>=2.5.1a1 is only satisfiable with opm 2.x (prerelease);
    # the stable opm releases all cap ovos-bus-client<2.0.0. Pin the prerelease
    # floor so the resolver picks it without --pre.
    "ovos-plugin-manager>=2.3.0a1,<3.0.0",
    "ovos-utils>=0.3.5,<1.0.0",
    "ovos-bus-client>=2.5.1a1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/padacioso"

[project.entry-points."opm.pipeline"]
"ovos-padacioso-pipeline-plugin" = "padacioso.opm:PadaciosoPipeline"

[tool.setuptools.dynamic]
version = { attr = "padacioso.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["padacioso*"]
